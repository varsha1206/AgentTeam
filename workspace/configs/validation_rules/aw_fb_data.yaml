schema:
  age:
    type: int
    nullable: false
    min: 0
    max: 120

  gender:
    type: int
    nullable: false
    min: 0
    max: 1

  height:
    type: float
    nullable: false
    min: 50
    max: 250

  weight:
    type: float
    nullable: false
    min: 20
    max: 300

  steps:
    type: float
    nullable: false
    min: 0

  heart_rate:
    type: float
    nullable: false
    min: 20
    max: 250

  calories:
    type: float
    nullable: false
    min: 0

  distance:
    type: float
    nullable: false
    min: 0

  device:
    type: str
    nullable: false

  activity:
    type: str
    nullable: false

transformations:
  - operation: coerce_numeric
    selection: infer
    description: Convert numeric columns to appropriate numeric types.

  - operation: trim_string_columns
    selection: infer
    description: Remove leading and trailing whitespace from string columns.
