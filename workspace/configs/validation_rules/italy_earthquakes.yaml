schema:
  Time:
    type: datetime
    nullable: false

  Latitude:
    type: float
    nullable: false
    min: -90
    max: 90

  Longitude:
    type: float
    nullable: false
    min: -180
    max: 180

  Depth:
    type: float
    nullable: false

  Magnitude:
    type: float
    nullable: false

transformations:
  - operation: coerce_numeric
    selection: infer
    description: Convert numeric columns to appropriate numeric types.

  - operation: coerce_datetime
    selection: infer
    description: Convert the 'Time' column to datetime format.

  - operation: create_date_column
    selection: infer
    description: Create a new column 'Date' by extracting the date from the 'Time' column.
